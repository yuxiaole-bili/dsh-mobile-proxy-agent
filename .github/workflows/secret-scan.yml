name: secret-scan
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描密钥与真实地址
        run: |
          fail=0
          EX="--exclude-dir=.git --exclude-dir=evidence --exclude-dir=node_modules"
          # 1) 密钥形态（占位符 <...> 不算）
          if grep -rInE '(sk-[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{20,}|dshcap=[A-Za-z0-9_-]{12,}|[?&]k=[A-Za-z0-9_-]{16,})' $EX . ; then
            echo "::error::发现疑似密钥"; fail=1
          fi
          # 2) 真实内网地址
          if grep -rInE '\b192\.168\.[0-9]{1,3}\.[0-9]{1,3}\b' $EX . ; then
            echo "::error::发现真实内网地址"; fail=1
          fi
          # 3) Tailscale CGNAT 地址（100.64.0.0 是网段判断，白名单放行）
          hits=$(grep -rInE '\b100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b' $EX . | grep -v '100\.64\.0\.0' || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::发现真实 Tailscale 地址"; fail=1; fi
          # 4) 个人目录名 / Windows 用户路径
          if grep -rInE '[A-Za-z]:\\\\Users\\\\[A-Za-z0-9_.-]+' $EX . ; then
            echo "::error::发现个人路径"; fail=1
          fi
          if [ "$fail" = "1" ]; then exit 1; fi
          echo "扫描通过：未发现密钥或真实地址"
