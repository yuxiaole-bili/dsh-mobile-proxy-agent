name: android

# 打标签时构建 APK 并挂到对应 Release：
#   git tag v0.2.1 && git push origin v0.2.1
# 也可以在 Actions 页面手动触发并指定一个"已存在的标签"，把 APK 补挂到旧 Release（用它补 v0.2.0）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 要把 APK 挂到哪个已存在的标签（如 v0.2.0）
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK（build-tools + platform 34）
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ] && command -v sdkmanager >/dev/null; then
            SDKMGR=sdkmanager
          else
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -f "$SDK/platforms/android-34/android.jar" ] || [ -z "$(ls -d "$SDK"/build-tools/* 2>/dev/null)" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          fi
          ls -d "$SDK"/build-tools/* | tail -2

      - name: 用固定 keystore 签名（可选：配置了 Secrets 才生效）
        env:
          # secrets 不能直接写在 if 里（会导致整个工作流校验失败、连 job 都不启动）
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: ${{ env.KS_B64 != '' }}
        run: |
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: 构建 APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          KS_ALIAS: ${{ secrets.ANDROID_KS_ALIAS }}
        run: |
          export DSH_SRC="$GITHUB_WORKSPACE/android" DSH_OUT="$GITHUB_WORKSPACE/out"
          export DSH_JDK="$JAVA_HOME" DSH_SDK="$ANDROID_HOME"
          pwsh -File android/build.ps1
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cp out/DSH.apk "DSH-${TAG}-ci.apk"
          ls -l "DSH-${TAG}-ci.apk"

      - name: 挂到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: DSH-*.apk
